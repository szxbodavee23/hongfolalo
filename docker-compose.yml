services:
  db:
    image: postgres:16-alpine
    container_name: honfoglalo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honfoglalo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honfoglalo_pass}
      POSTGRES_DB: ${POSTGRES_DB:-honfoglalo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - honfoglalo_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honfoglalo} -d ${POSTGRES_DB:-honfoglalo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: honfoglalo-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  honfoglalo_pgdata:

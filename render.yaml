services:
  - type: web
    name: honfoglalo-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: honfoglalo-db
          property: connectionString

databases:
  - name: honfoglalo-db
    plan: free
    databaseName: honfoglalo
    user: honfoglalo
